{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-10 bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-extrabold text-slate-900">Create an Account</h2>
        <p class="text-xs text-slate-500 mt-1">Choose your account type to proceed</p>
    </div>

    <form action="/register" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Account Role</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="border border-slate-200 rounded-xl p-3 flex flex-col items-center gap-1 cursor-pointer hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/40">
                    <input type="radio" name="role" value="customer" checked class="accent-indigo-600">
                    <span class="text-xs font-bold text-slate-800">Customer</span>
                    <span class="text-[10px] text-slate-400">Book services</span>
                </label>
                <label class="border border-slate-200 rounded-xl p-3 flex flex-col items-center gap-1 cursor-pointer hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/40">
                    <input type="radio" name="role" value="provider" class="accent-indigo-600">
                    <span class="text-xs font-bold text-slate-800">Provider</span>
                    <span class="text-[10px] text-slate-400">Accept jobs</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" name="name" required placeholder="John Doe" class="w-full border rounded-lg px-3 py-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="name@example.com" class="w-full border rounded-lg px-3 py-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full border rounded-lg px-3 py-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-xs transition shadow-md shadow-indigo-100">
            Complete Registration
        </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
        Already registered? 
        <a href="/login" class="text-indigo-600 font-bold hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
